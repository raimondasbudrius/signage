<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molėtų progimnazija – Signage</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #0f172a;
            color: white;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* ─── Source Containers ─── */
        .source-container {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            pointer-events: none;
            z-index: 1;
        }

        .source-container.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 2;
        }

        .source-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ─── Top Bar Overlay ─── */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: linear-gradient(180deg, rgba(15,23,42,0.95) 0%, rgba(15,23,42,0.7) 70%, transparent 100%);
            padding: 12px 24px 24px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }

        .school-name {
            font-size: 1.3rem;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .source-label {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-top: 2px;
        }

        .clock-area {
            text-align: right;
        }

        .clock-time {
            font-size: 2rem;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .clock-date {
            font-size: 0.85rem;
            opacity: 0.7;
            text-transform: capitalize;
        }

        /* ─── Progress Bar ─── */
        .progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            z-index: 100;
            transition: width 1s linear;
            border-radius: 0 2px 2px 0;
        }

        /* ─── Source Indicator Dots ─── */
        .source-dots {
            position: fixed;
            bottom: 16px;
            right: 24px;
            z-index: 100;
            display: flex;
            gap: 8px;
        }

        .source-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transition: all 0.3s;
        }

        .source-dot.active {
            background: #3b82f6;
            box-shadow: 0 0 8px rgba(59,130,246,0.6);
            transform: scale(1.3);
        }


        /* ─── Idle / No Schedule Screen (black screen) ─── */
        .idle-screen {
            position: absolute;
            inset: 0;
            background: #000;
            z-index: 1;
        }

        .idle-screen.hidden { display: none; }

        /* ─── Loading ─── */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: opacity 0.5s;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            margin-top: 16px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <!-- Loading -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">Kraunama...</div>
    </div>

    <!-- Top Bar -->
    <div class="top-bar" id="topBar">
        <div>
            <div class="school-name" id="schoolName">Molėtų progimnazija</div>
            <div class="source-label" id="sourceLabel"></div>
        </div>
        <div class="clock-area">
            <div class="clock-time" id="clockTime">--:--</div>
            <div class="clock-date" id="clockDate"></div>
        </div>
    </div>

    <!-- Source: Tvarkarastis -->
    <div class="source-container" id="src-tvarkarastis">
        <iframe id="iframe-tvarkarastis" src="about:blank"></iframe>
    </div>

    <!-- Source: Google Slides -->
    <div class="source-container" id="src-slides">
        <iframe id="iframe-slides" src="about:blank"></iframe>
    </div>

    <!-- Source: Facebook -->
    <div class="source-container" id="src-facebook">
        <iframe id="iframe-facebook" src="about:blank"></iframe>
    </div>

    <!-- Idle Screen (fullscreen black when no active source) -->
    <div class="idle-screen hidden" id="idleScreen"></div>

    <!-- Progress Bar -->
    <div class="progress-bar" id="progressBar" style="width: 0%"></div>

    <!-- Source Dots -->
    <div class="source-dots" id="sourceDots"></div>

<script>
(function() {
    'use strict';

    // ─── LocalStorage Data Layer ───
    const STORAGE_KEYS = {
        schedule: 'signage_schedule',
        settings: 'signage_settings'
    };

    const DEFAULT_SETTINGS = {
        tvarkarastis_url: 'https://raimondasbudrius.github.io/tvarkarastis/',
        google_slides_id: '2PACX-1vQJp88eC9zQQGG_6XGfhvz5g5h9BwKuzdRAOi5ntp93DAdeICS-F3DLB9O0zjZSOgqr6rg3SmBn6zN9',
        facebook_page_id: 'Mokykla.Moletai',
        facebook_access_token: '',
        facebook_post_limit: '5',
        school_name: 'Molėtų progimnazija',
        transition_seconds: '5'
    };

    const DEFAULT_SCHEDULE = [
        { id: 1, name: 'Tvarkaraštis', source_type: 'tvarkarastis', start_time: '07:00', end_time: '17:00', duration_seconds: 120, days: '1,2,3,4,5', enabled: 1, sort_order: 1 },
        { id: 2, name: 'Google skaidrės', source_type: 'slides', start_time: '07:00', end_time: '17:00', duration_seconds: 120, days: '1,2,3,4,5', enabled: 1, sort_order: 2 },
        { id: 3, name: 'Facebook naujienos', source_type: 'facebook', start_time: '07:00', end_time: '17:00', duration_seconds: 120, days: '1,2,3,4,5', enabled: 1, sort_order: 3 }
    ];

    function getSettings() {
        try {
            const raw = localStorage.getItem(STORAGE_KEYS.settings);
            if (raw) return JSON.parse(raw);
        } catch (e) { console.warn('Settings parse error:', e); }
        return { ...DEFAULT_SETTINGS };
    }

    function getSchedule() {
        try {
            const raw = localStorage.getItem(STORAGE_KEYS.schedule);
            if (raw) return JSON.parse(raw);
        } catch (e) { console.warn('Schedule parse error:', e); }
        return [...DEFAULT_SCHEDULE];
    }

    // ─── State ───
    let config = null;
    let activeSources = null; // null = not yet evaluated (distinct from [] = evaluated, none active)
    let currentSourceIndex = -1;
    let sourceTimer = null;
    let progressTimer = null;
    let progressStart = 0;
    let progressDuration = 0;
    let slidesUrl = ''; // Stored for background refresh
    let facebookUrl = ''; // Stored so we can reload FB fresh (starts at post #1)

    const DAY_NAMES = ['Sekmadienis', 'Pirmadienis', 'Antradienis', 'Trečiadienis', 'Ketvirtadienis', 'Penktadienis', 'Šeštadienis'];
    const MONTH_NAMES = ['sausio', 'vasario', 'kovo', 'balandžio', 'gegužės', 'birželio', 'liepos', 'rugpjūčio', 'rugsėjo', 'spalio', 'lapkričio', 'gruodžio'];

    // ─── Clock ───
    function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');

        document.getElementById('clockTime').textContent = `${h}:${m}`;
        document.getElementById('clockDate').textContent =
            `${DAY_NAMES[now.getDay()]}, ${now.getFullYear()} m. ${MONTH_NAMES[now.getMonth()]} ${now.getDate()} d.`;
    }

    setInterval(updateClock, 1000);
    updateClock();

    // Assigning iframe.src always forces a full reload – even when the URL is
    // identical. loadConfig() runs every 5 minutes, so blindly re-setting the
    // same URL would tear down warmed-up pages (e.g. the Facebook iframe with
    // its pre-fetched, translated posts) over and over. Only navigate when the
    // URL really changed.
    function setIframeSrcIfChanged(iframeId, src) {
        const iframe = document.getElementById(iframeId);
        if (!iframe) return;
        if (iframe.getAttribute('src') === src) return;
        iframe.src = src;
    }

    // ─── Load Config from localStorage ───
    function loadConfig() {
        try {
            const settings = getSettings();
            const schedule = getSchedule().filter(e => e.enabled);

            config = {
                school_name: settings.school_name || DEFAULT_SETTINGS.school_name,
                tvarkarastis_url: settings.tvarkarastis_url || DEFAULT_SETTINGS.tvarkarastis_url,
                google_slides_id: settings.google_slides_id || DEFAULT_SETTINGS.google_slides_id,
                facebook_page_id: settings.facebook_page_id || DEFAULT_SETTINGS.facebook_page_id,
                facebook_post_limit: settings.facebook_post_limit || DEFAULT_SETTINGS.facebook_post_limit,
                transition_seconds: parseInt(settings.transition_seconds || '5'),
                schedule: schedule
            };

            document.getElementById('schoolName').textContent = config.school_name;

            // Preload iframes
            const tvUrl = config.tvarkarastis_url;
            // Support both regular presentation IDs and published presentation URLs/IDs
            const slidesId = config.google_slides_id;
            if (slidesId.startsWith('http')) {
                // Full URL provided, use it directly
                slidesUrl = slidesId;
            } else if (slidesId.startsWith('2PACX-')) {
                // Published presentation ID – use /embed (not /pub, which sets X-Frame-Options: SAMEORIGIN)
                slidesUrl = `https://docs.google.com/presentation/d/e/${slidesId}/embed?start=true&loop=true&delayms=10000`;
            } else {
                // Regular presentation ID
                slidesUrl = `https://docs.google.com/presentation/d/${slidesId}/embed?start=true&loop=true&delayms=10000`;
            }

            // Facebook slideshow page URL - use absolute path for GitHub Pages
            const fbPageId = config.facebook_page_id || 'Mokykla.Moletai';
            const fbLimit = config.facebook_post_limit || '5';
            const basePath = window.location.pathname.replace(/[^/]*$/, '');
            const fbSlideshowUrl = `${basePath}facebook.html?page=${encodeURIComponent(fbPageId)}&limit=${encodeURIComponent(fbLimit)}&embed=1`;
            facebookUrl = fbSlideshowUrl;

            // Tvarkarastis gets ?embed=1 (same convention as facebook.html) and
            // the signage embed CSS is injected into its iframe document.
            // Note: slides src is always re-assigned (they are refreshed on
            // purpose); tvarkarastis/facebook are only re-navigated when their
            // URL really changed, so their warmed-up state survives reloads
            // of the config (which happens every 5 minutes).
            const tvSeparator = tvUrl.includes('?') ? '&' : '?';
            setIframeSrcIfChanged('iframe-tvarkarastis', tvUrl + tvSeparator + 'embed=1');
            document.getElementById('iframe-slides').src = slidesUrl;
            setIframeSrcIfChanged('iframe-facebook', fbSlideshowUrl);

            applyTvarkarastisEmbedStyle();

            buildActiveSources();
            document.getElementById('loadingOverlay').classList.add('hidden');
        } catch (err) {
            console.error('Failed to load config:', err);
            document.getElementById('loadingOverlay').innerHTML =
                '<div style="text-align:center"><div style="font-size:3rem">⚠️</div><div style="margin-top:16px">Klaida kraunant nustatymus</div></div>';
        }
    }

    // ─── Build Active Sources for Current Time ───
    function buildActiveSources() {
        if (!config) return;

        const now = new Date();
        const currentDay = now.getDay(); // 0=Sun
        const currentMinutes = now.getHours() * 60 + now.getMinutes();

        // Filter schedule entries that match current day and time window
        const matching = config.schedule.filter(entry => {
            const days = entry.days.split(',').map(Number);
            if (!days.includes(currentDay)) return false;

            const [sh, sm] = entry.start_time.split(':').map(Number);
            const [eh, em] = entry.end_time.split(':').map(Number);
            const startMin = sh * 60 + sm;
            const endMin = eh * 60 + em;

            return currentMinutes >= startMin && currentMinutes < endMin;
        });

        // Sort by sort_order
        matching.sort((a, b) => a.sort_order - b.sort_order);

        // Check if the active set changed
        const newKey = matching.map(m => m.id).join(',');
        const oldKey = activeSources === null ? null : activeSources.map(m => m.id).join(',');

        if (newKey !== oldKey) {
            activeSources = matching;
            currentSourceIndex = -1;
            buildDots();

            if (activeSources.length > 0) {
                hideIdle();
                advanceSource();
            } else {
                showIdle();
            }
        }
    }

    // ─── Source Dots ───
    function buildDots() {
        const container = document.getElementById('sourceDots');
        container.innerHTML = '';
        activeSources.forEach((_, i) => {
            const dot = document.createElement('div');
            dot.className = 'source-dot';
            dot.dataset.index = i;
            container.appendChild(dot);
        });
    }

    function updateDots() {
        document.querySelectorAll('.source-dot').forEach((dot, i) => {
            dot.classList.toggle('active', i === currentSourceIndex);
        });
    }

    // ─── Show Idle (fullscreen black screen) ───
    function showIdle() {
        clearTimeout(sourceTimer);
        clearInterval(progressTimer);
        document.querySelectorAll('.source-container').forEach(el => el.classList.remove('active'));
        document.getElementById('idleScreen').classList.remove('hidden');
        // Hide all overlays so the screen is completely black
        document.getElementById('topBar').style.display = 'none';
        document.getElementById('progressBar').style.display = 'none';
        document.getElementById('sourceDots').style.display = 'none';
        document.getElementById('sourceLabel').textContent = '';
    }

    function hideIdle() {
        document.getElementById('idleScreen').classList.add('hidden');
        document.getElementById('topBar').style.display = '';
        document.getElementById('progressBar').style.display = '';
        document.getElementById('sourceDots').style.display = '';
    }

    // ─── Advance to Next Source ───
    function advanceSource() {
        if (activeSources.length === 0) {
            showIdle();
            return;
        }

        currentSourceIndex = (currentSourceIndex + 1) % activeSources.length;
        const entry = activeSources[currentSourceIndex];

        // Always refresh Google Slides right before showing it,
        // so the latest published content is displayed
        if (entry.source_type === 'slides') {
            refreshSlides();
        }

        // Restart the warm Facebook slideshow from post #1 (no reload, so the
        // pre-fetched posts are visible instantly)
        if (entry.source_type === 'facebook') {
            refreshFacebook();
        }

        // Hide all, show current
        document.querySelectorAll('.source-container').forEach(el => el.classList.remove('active'));
        const container = document.getElementById(`src-${entry.source_type}`);
        if (container) {
            container.classList.add('active');
        }

        document.getElementById('sourceLabel').textContent = entry.name;
        updateDots();

        // Progress bar
        progressDuration = entry.duration_seconds * 1000;
        progressStart = Date.now();
        clearInterval(progressTimer);
        progressTimer = setInterval(updateProgress, 200);
        updateProgress();

        // Schedule next
        clearTimeout(sourceTimer);
        sourceTimer = setTimeout(() => {
            advanceSource();
        }, progressDuration);
    }

    function updateProgress() {
        const elapsed = Date.now() - progressStart;
        const pct = Math.min(100, (elapsed / progressDuration) * 100);
        document.getElementById('progressBar').style.width = pct + '%';
    }

    // ─── Periodic Refresh ───
    // Re-check schedule every 30 seconds (to pick up time window changes)
    setInterval(buildActiveSources, 30000);

    // Reload config every 5 minutes (to pick up admin changes from localStorage)
    setInterval(loadConfig, 5 * 60 * 1000);

    // ─── Google Slides Background Refresh ───
    // Fully destroy and recreate the slides iframe so the browser is forced
    // to make a brand-new request (bypasses cached iframe document).
    function refreshSlides() {
        const container = document.getElementById('src-slides');
        if (!container || !slidesUrl) return;

        const oldIframe = document.getElementById('iframe-slides');
        if (oldIframe) oldIframe.remove();

        const iframe = document.createElement('iframe');
        iframe.id = 'iframe-slides';
        const separator = slidesUrl.includes('?') ? '&' : '?';
        iframe.src = slidesUrl + separator + '_t=' + Date.now();
        container.appendChild(iframe);
        console.log('🔄 Google Slides refreshed (iframe recreated)');
    }
    // Refresh slides every 5 minutes in the background
    setInterval(refreshSlides, 5 * 60 * 1000);

    // ─── Facebook Fresh Restart ───
    // The Facebook iframe is loaded once on startup and then kept "warm":
    // while other sources are on screen it fetches the feed, translates the
    // posts and caches the images in the background. When it is Facebook's
    // turn we only tell the already-loaded page to restart its slideshow from
    // post #1 (postMessage) – no reload, so viewers never see a loading
    // screen. The iframe is recreated only as a fallback if it went missing.
    function refreshFacebook() {
        const iframe = document.getElementById('iframe-facebook');

        if (iframe && iframe.contentWindow) {
            iframe.contentWindow.postMessage({ type: 'signage-restart' }, '*');
            console.log('🔄 Facebook restarted from post #1 (warm iframe, no reload)');
            return;
        }

        const container = document.getElementById('src-facebook');
        if (!container || !facebookUrl) return;

        if (iframe) iframe.remove();

        const newIframe = document.createElement('iframe');
        newIframe.id = 'iframe-facebook';
        const separator = facebookUrl.includes('?') ? '&' : '?';
        newIframe.src = facebookUrl + separator + '_t=' + Date.now();
        container.appendChild(newIframe);
        console.log('🔄 Facebook reloaded (starts at post #1)');
    }

    // ─── Tvarkarastis Embed Mode ───
    // On the signage display the tvarkarastis source must show ONLY the
    // fullscreen timetable table (class column + full day of lessons) —
    // no header, no filters, no day selector, no legend.
    // The standalone tvarkarastis project stays untouched, so the styles are
    // injected directly into the iframe's own document (same-origin GitHub
    // Pages). Re-applied on every iframe (re)load.
    const TV_EMBED_STYLE_ID = 'signage-embed-style';

    const TVARKARASTIS_EMBED_CSS = `
        html, body {
            margin: 0 !important;
            height: 100% !important;
            overflow: hidden !important;
        }

        /* Leave room for the signage top-bar / progress-bar / source dots */
        body { padding: 70px 12px 32px 12px !important; }

        /* Hide the standalone page UI */
        .header-bar,
        .filter-bar,
        .day-selector,
        .legend { display: none !important; }

        #app { height: 100% !important; }

        /* Fullscreen timetable */
        .timeline-container {
            height: 100% !important;
            width: 100% !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            overflow: hidden !important;
            padding: 0 !important;
        }

        /* Note: width/height must NOT be !important — they are managed by the
           auto-fit script below */
        .timeline-table {
            height: 100%;
            width: 100%;
            min-width: 0 !important;
            font-size: clamp(11px, 1.7vh, 18px) !important;
            transform-origin: 0 0;
        }

        .timeline-table th { padding: clamp(4px, 0.8vh, 10px) 4px !important; }
        .period-header .period-num   { font-size: clamp(14px, 2.6vh, 28px) !important; }
        .period-header .period-time  { font-size: clamp(10px, 1.8vh, 19px) !important; }
        .period-header .period-break { font-size: clamp(9px, 1.5vh, 16px) !important; }

        .timeline-table td {
            min-width: 0 !important;
            max-width: none !important;
            padding: clamp(2px, 0.4vh, 6px) !important;
        }

        .class-row td:first-child {
            font-size: clamp(16px, 3vh, 34px) !important;
            width: clamp(48px, 5vw, 90px) !important;
            min-width: clamp(48px, 5vw, 90px) !important;
            max-width: clamp(48px, 5vw, 90px) !important;
        }

        .lesson-info { line-height: 1.22 !important; }
        .lesson-info > div:first-child { font-size: clamp(12px, 2vh, 22px) !important; }
        .lesson-info > div:last-child  { font-size: clamp(10px, 1.8vh, 20px) !important; }

        .lesson-class { font-size: clamp(12px, 2vh, 22px) !important; }
        .room-badge, .split-badge { font-size: clamp(9px, 1.4vh, 15px) !important; }
        .break-indicator { font-size: clamp(11px, 1.9vh, 20px) !important; }
        .break-indicator span { font-size: clamp(9px, 1.5vh, 16px) !important; }
        .no-lesson { font-size: clamp(10px, 1.7vh, 18px) !important; }
    `;

    // Auto-fit: scales the table (CSS transform scale) so the WHOLE timetable
    // (every class row AND all 8 period columns) is always visible on screen,
    // no matter how many lessons each class has that day.
    // Re-runs whenever tvarkarastis re-renders (its own 1-min / 10-min timers).
    const TVARKARASTIS_EMBED_JS = `
(function () {
    if (window.__signageAutoFitInstalled) return;
    window.__signageAutoFitInstalled = true;
    window.__signageFitLog = [];

    function log(msg) {
        try {
            window.__signageFitLog.push(String(msg));
            if (window.__signageFitLog.length > 50) window.__signageFitLog.shift();
        } catch (e) {}
    }

    // Throttle: run at most ~10 fits/sec; coalesce bursts via setTimeout
    // (no requestAnimationFrame — it is not reliable in all headless contexts)
    var lastFit = 0;
    var pendingTimer = null;

    function runFit(reason) {
        lastFit = Date.now();
        try {
            fitTable(reason);
        } catch (e) {
            log('ERR ' + (e && e.message));
        }
    }

    function requestFit(reason) {
        if (Date.now() - lastFit >= 100) {
            runFit(reason);
            return;
        }
        if (pendingTimer !== null) return;
        pendingTimer = setTimeout(function () {
            pendingTimer = null;
            runFit(reason);
        }, 120);
    }

    function rectH(el) {
        return el ? el.getBoundingClientRect().height : 0;
    }

    function fitTable(reason) {
        var table = document.getElementById('timelineTable');
        var container = document.querySelector('.timeline-container');
        var appEl = document.getElementById('app');
        if (!table || !container || !appEl || appEl.style.display === 'none') {
            log(reason + ': skip (app hidden or missing)');
            return;
        }

        var availW = container.clientWidth;
        var availH = container.clientHeight;
        if (availW <= 0 || availH <= 0) {
            log(reason + ': skip (container ' + availW + 'x' + availH + ')');
            return;
        }

        // Iteratively find the largest scale (max 1) at which the WHOLE table
        // fits both the available width AND height (wider table = fewer wrapped
        // lines = shorter table). Uses transform:scale() instead of CSS zoom:
        // offsetWidth/offsetHeight are transform-independent, so the math is
        // deterministic and the right-hand period columns never get clipped.
        var s = 1;
        for (var i = 0; i < 6; i++) {
            // Reset inline sizing so we measure the natural content size
            table.style.transform = 'none';
            table.style.height = 'auto';
            table.style.width = Math.max(1, Math.floor(availW / s)) + 'px';
            var contentW = table.offsetWidth;
            var contentH = table.offsetHeight;
            if (contentW <= 0 || contentH <= 0) {
                log(reason + ': skip (content ' + contentW + 'x' + contentH + ')');
                return;
            }

    function applyTvarkarastisEmbedStyle() {

            doc = iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
