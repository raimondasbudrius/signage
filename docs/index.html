<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molėtų progimnazija – Signage</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #0f172a;
            color: white;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* ─── Source Containers ─── */
        .source-container {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            pointer-events: none;
            z-index: 1;
        }

        .source-container.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 2;
        }

        .source-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ─── Top Bar Overlay ─── */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: linear-gradient(180deg, rgba(15,23,42,0.95) 0%, rgba(15,23,42,0.7) 70%, transparent 100%);
            padding: 12px 24px 24px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }

        .school-name {
            font-size: 1.3rem;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .source-label {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-top: 2px;
        }

        .clock-area {
            text-align: right;
        }

        .clock-time {
            font-size: 2rem;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .clock-date {
            font-size: 0.85rem;
            opacity: 0.7;
            text-transform: capitalize;
        }

        /* ─── Progress Bar ─── */
        .progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            z-index: 100;
            transition: width 1s linear;
            border-radius: 0 2px 2px 0;
        }

        /* ─── Source Indicator Dots ─── */
        .source-dots {
            position: fixed;
            bottom: 16px;
            right: 24px;
            z-index: 100;
            display: flex;
            gap: 8px;
        }

        .source-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transition: all 0.3s;
        }

        .source-dot.active {
            background: #3b82f6;
            box-shadow: 0 0 8px rgba(59,130,246,0.6);
            transform: scale(1.3);
        }

        /* ─── Facebook Posts View ─── */
        .fb-view {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%);
            display: flex;
            flex-direction: column;
            padding: 80px 40px 40px;
            overflow: hidden;
        }

        .fb-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .fb-header h2 {
            font-size: 2rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .fb-header .fb-icon {
            width: 40px;
            height: 40px;
            background: #1877f2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 900;
        }

        .fb-posts {
            flex: 1;
            display: flex;
            gap: 24px;
            justify-content: center;
            align-items: stretch;
            overflow: hidden;
        }

        .fb-post {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 16px;
            overflow: hidden;
            flex: 1;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }

        .fb-post-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: rgba(255,255,255,0.05);
        }

        .fb-post-body {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .fb-post-text {
            font-size: 1rem;
            line-height: 1.5;
            flex: 1;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 6;
            -webkit-box-orient: vertical;
        }

        .fb-post-time {
            font-size: 0.8rem;
            opacity: 0.5;
            margin-top: 12px;
        }

        .fb-no-posts {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            opacity: 0.5;
            font-size: 1.2rem;
        }

        .fb-no-posts .icon {
            font-size: 4rem;
            margin-bottom: 16px;
        }

        /* ─── Idle / No Schedule Screen ─── */
        .idle-screen {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #1a73e8 0%, #0d3c7d 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .idle-screen.hidden { display: none; }

        .idle-clock {
            font-size: 6rem;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
        }

        .idle-date {
            font-size: 1.5rem;
            opacity: 0.8;
            margin-top: 8px;
            text-transform: capitalize;
        }

        .idle-school {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 32px;
            opacity: 0.9;
        }

        .idle-note {
            margin-top: 24px;
            font-size: 1rem;
            opacity: 0.5;
        }

        /* ─── Loading ─── */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: opacity 0.5s;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            margin-top: 16px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <!-- Loading -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">Kraunama...</div>
    </div>

    <!-- Top Bar -->
    <div class="top-bar" id="topBar">
        <div>
            <div class="school-name" id="schoolName">Molėtų progimnazija</div>
            <div class="source-label" id="sourceLabel"></div>
        </div>
        <div class="clock-area">
            <div class="clock-time" id="clockTime">--:--</div>
            <div class="clock-date" id="clockDate"></div>
        </div>
    </div>

    <!-- Source: Tvarkarastis -->
    <div class="source-container" id="src-tvarkarastis">
        <iframe id="iframe-tvarkarastis" src="about:blank"></iframe>
    </div>

    <!-- Source: Google Slides -->
    <div class="source-container" id="src-slides">
        <iframe id="iframe-slides" src="about:blank"></iframe>
    </div>

    <!-- Source: Facebook -->
    <div class="source-container" id="src-facebook">
        <div class="fb-view">
            <div class="fb-header">
                <h2><span class="fb-icon">f</span> Naujienos iš Facebook</h2>
            </div>
            <div class="fb-posts" id="fbPosts">
                <div class="fb-no-posts">
                    <div class="icon">📰</div>
                    <div>Kraunami įrašai...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Idle Screen -->
    <div class="idle-screen hidden" id="idleScreen">
        <div class="idle-clock" id="idleClock">--:--</div>
        <div class="idle-date" id="idleDate"></div>
        <div class="idle-school" id="idleSchool">Molėtų progimnazija</div>
        <div class="idle-note">Šiuo metu nėra aktyvaus tvarkaraščio</div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar" id="progressBar" style="width: 0%"></div>

    <!-- Source Dots -->
    <div class="source-dots" id="sourceDots"></div>

<script>
(function() {
    'use strict';

    // ─── LocalStorage Data Layer ───
    const STORAGE_KEYS = {
        schedule: 'signage_schedule',
        settings: 'signage_settings'
    };

    const DEFAULT_SETTINGS = {
        tvarkarastis_url: 'https://raimondasbudrius.github.io/tvarkarastis/',
        google_slides_id: '1HAUtKaTAkO0XrB7OR2e8lEbvcXf_MZYpQgOy-jt0ls8',
        facebook_page_id: 'Mokykla.Moletai',
        facebook_access_token: '',
        school_name: 'Molėtų progimnazija',
        transition_seconds: '5'
    };

    const DEFAULT_SCHEDULE = [
        { id: 1, name: 'Tvarkaraštis', source_type: 'tvarkarastis', start_time: '07:00', end_time: '17:00', duration_seconds: 120, days: '1,2,3,4,5', enabled: 1, sort_order: 1 },
        { id: 2, name: 'Google skaidrės', source_type: 'slides', start_time: '07:00', end_time: '17:00', duration_seconds: 120, days: '1,2,3,4,5', enabled: 1, sort_order: 2 },
        { id: 3, name: 'Facebook naujienos', source_type: 'facebook', start_time: '07:00', end_time: '17:00', duration_seconds: 120, days: '1,2,3,4,5', enabled: 1, sort_order: 3 }
    ];

    function getSettings() {
        try {
            const raw = localStorage.getItem(STORAGE_KEYS.settings);
            if (raw) return JSON.parse(raw);
        } catch (e) { console.warn('Settings parse error:', e); }
        return { ...DEFAULT_SETTINGS };
    }

    function getSchedule() {
        try {
            const raw = localStorage.getItem(STORAGE_KEYS.schedule);
            if (raw) return JSON.parse(raw);
        } catch (e) { console.warn('Schedule parse error:', e); }
        return [...DEFAULT_SCHEDULE];
    }

    // ─── State ───
    let config = null;
    let activeSources = [];
    let currentSourceIndex = -1;
    let sourceTimer = null;
    let progressTimer = null;
    let progressStart = 0;
    let progressDuration = 0;

    const DAY_NAMES = ['Sekmadienis', 'Pirmadienis', 'Antradienis', 'Trečiadienis', 'Ketvirtadienis', 'Penktadienis', 'Šeštadienis'];
    const MONTH_NAMES = ['sausio', 'vasario', 'kovo', 'balandžio', 'gegužės', 'birželio', 'liepos', 'rugpjūčio', 'rugsėjo', 'spalio', 'lapkričio', 'gruodžio'];

    // ─── Clock ───
    function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');

        document.getElementById('clockTime').textContent = `${h}:${m}`;
        document.getElementById('clockDate').textContent =
            `${DAY_NAMES[now.getDay()]}, ${now.getFullYear()} m. ${MONTH_NAMES[now.getMonth()]} ${now.getDate()} d.`;

        document.getElementById('idleClock').textContent = `${h}:${m}:${s}`;
        document.getElementById('idleDate').textContent =
            `${DAY_NAMES[now.getDay()]}, ${now.getFullYear()} m. ${MONTH_NAMES[now.getMonth()]} ${now.getDate()} d.`;
    }

    setInterval(updateClock, 1000);
    updateClock();

    // ─── Load Config from localStorage ───
    function loadConfig() {
        try {
            const settings = getSettings();
            const schedule = getSchedule().filter(e => e.enabled);

            config = {
                school_name: settings.school_name || DEFAULT_SETTINGS.school_name,
                tvarkarastis_url: settings.tvarkarastis_url || DEFAULT_SETTINGS.tvarkarastis_url,
                google_slides_id: settings.google_slides_id || DEFAULT_SETTINGS.google_slides_id,
                facebook_page_id: settings.facebook_page_id || DEFAULT_SETTINGS.facebook_page_id,
                transition_seconds: parseInt(settings.transition_seconds || '5'),
                schedule: schedule
            };

            document.getElementById('schoolName').textContent = config.school_name;
            document.getElementById('idleSchool').textContent = config.school_name;

            // Preload iframes
            const tvUrl = config.tvarkarastis_url;
            const slidesUrl = `https://docs.google.com/presentation/d/${config.google_slides_id}/embed?start=true&loop=true&delayms=5000`;

            document.getElementById('iframe-tvarkarastis').src = tvUrl;
            document.getElementById('iframe-slides').src = slidesUrl;

            buildActiveSources();
            document.getElementById('loadingOverlay').classList.add('hidden');
        } catch (err) {
            console.error('Failed to load config:', err);
            document.getElementById('loadingOverlay').innerHTML =
                '<div style="text-align:center"><div style="font-size:3rem">⚠️</div><div style="margin-top:16px">Klaida kraunant nustatymus</div></div>';
        }
    }

    // ─── Build Active Sources for Current Time ───
    function buildActiveSources() {
        if (!config) return;

        const now = new Date();
        const currentDay = now.getDay(); // 0=Sun
        const currentMinutes = now.getHours() * 60 + now.getMinutes();

        // Filter schedule entries that match current day and time window
        const matching = config.schedule.filter(entry => {
            const days = entry.days.split(',').map(Number);
            if (!days.includes(currentDay)) return false;

            const [sh, sm] = entry.start_time.split(':').map(Number);
            const [eh, em] = entry.end_time.split(':').map(Number);
            const startMin = sh * 60 + sm;
            const endMin = eh * 60 + em;

            return currentMinutes >= startMin && currentMinutes < endMin;
        });

        // Sort by sort_order
        matching.sort((a, b) => a.sort_order - b.sort_order);

        // Check if the active set changed
        const newKey = matching.map(m => m.id).join(',');
        const oldKey = activeSources.map(m => m.id).join(',');

        if (newKey !== oldKey) {
            activeSources = matching;
            currentSourceIndex = -1;
            buildDots();

            if (activeSources.length > 0) {
                document.getElementById('idleScreen').classList.add('hidden');
                advanceSource();
            } else {
                showIdle();
            }
        }
    }

    // ─── Source Dots ───
    function buildDots() {
        const container = document.getElementById('sourceDots');
        container.innerHTML = '';
        activeSources.forEach((_, i) => {
            const dot = document.createElement('div');
            dot.className = 'source-dot';
            dot.dataset.index = i;
            container.appendChild(dot);
        });
    }

    function updateDots() {
        document.querySelectorAll('.source-dot').forEach((dot, i) => {
            dot.classList.toggle('active', i === currentSourceIndex);
        });
    }

    // ─── Show Idle ───
    function showIdle() {
        clearTimeout(sourceTimer);
        clearInterval(progressTimer);
        document.querySelectorAll('.source-container').forEach(el => el.classList.remove('active'));
        document.getElementById('idleScreen').classList.remove('hidden');
        document.getElementById('progressBar').style.width = '0%';
        document.getElementById('sourceLabel').textContent = '';
    }

    // ─── Advance to Next Source ───
    function advanceSource() {
        if (activeSources.length === 0) {
            showIdle();
            return;
        }

        currentSourceIndex = (currentSourceIndex + 1) % activeSources.length;
        const entry = activeSources[currentSourceIndex];

        // Hide all, show current
        document.querySelectorAll('.source-container').forEach(el => el.classList.remove('active'));
        const container = document.getElementById(`src-${entry.source_type}`);
        if (container) {
            container.classList.add('active');
        }

        document.getElementById('sourceLabel').textContent = entry.name;
        updateDots();

        // If facebook, show info message (no server proxy available)
        if (entry.source_type === 'facebook') {
            renderFacebookPosts([]);
        }

        // Progress bar
        progressDuration = entry.duration_seconds * 1000;
        progressStart = Date.now();
        clearInterval(progressTimer);
        progressTimer = setInterval(updateProgress, 200);
        updateProgress();

        // Schedule next
        clearTimeout(sourceTimer);
        sourceTimer = setTimeout(() => {
            advanceSource();
        }, progressDuration);
    }

    function updateProgress() {
        const elapsed = Date.now() - progressStart;
        const pct = Math.min(100, (elapsed / progressDuration) * 100);
        document.getElementById('progressBar').style.width = pct + '%';
    }

    // ─── Facebook Posts (static version - no server proxy) ───
    function renderFacebookPosts(posts) {
        const container = document.getElementById('fbPosts');

        if (!posts || posts.length === 0) {
            container.innerHTML = `
                <div class="fb-no-posts">
                    <div class="icon">📱</div>
                    <div>Facebook įrašai nepasiekiami</div>
                    <div style="font-size:0.9rem;margin-top:8px;opacity:0.6">
                        Facebook API reikalauja serverio (CORS ribojimai)
                    </div>
                </div>`;
            return;
        }

        container.innerHTML = posts.map(post => {
            const date = post.time ? new Date(post.time) : null;
            const dateStr = date
                ? `${MONTH_NAMES[date.getMonth()]} ${date.getDate()} d., ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`
                : '';

            const imgHtml = post.image
                ? `<img class="fb-post-image" src="${escapeHtml(post.image)}" alt="" onerror="this.style.display='none'">`
                : '';

            return `
                <div class="fb-post">
                    ${imgHtml}
                    <div class="fb-post-body">
                        <div class="fb-post-text">${escapeHtml(post.message || 'Nuotrauka')}</div>
                        <div class="fb-post-time">🕐 ${dateStr}</div>
                    </div>
                </div>`;
        }).join('');
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // ─── Periodic Refresh ───
    // Re-check schedule every 30 seconds (to pick up time window changes)
    setInterval(buildActiveSources, 30000);

    // Reload config every 5 minutes (to pick up admin changes from localStorage)
    setInterval(loadConfig, 5 * 60 * 1000);

    // Listen for localStorage changes (from admin page)
    window.addEventListener('storage', function(e) {
        if (e.key === STORAGE_KEYS.schedule || e.key === STORAGE_KEYS.settings) {
            loadConfig();
        }
    });

    // ─── Init ───
    loadConfig();

})();
</script>
</body>
</html>
