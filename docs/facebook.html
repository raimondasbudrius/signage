<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook naujienos – Molėtų progimnazija</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --fb-blue: #1877f2;
            --fb-blue-light: #4d9fff;
            --ink: #0a1424;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background: var(--ink);
            color: white;
        }

        /* ─── Ambient background ─── */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 60% at 85% -10%, rgba(24,119,242,0.30) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at -10% 110%, rgba(24,119,242,0.18) 0%, transparent 55%),
                linear-gradient(160deg, #0d1b30 0%, #0a1424 55%, #081020 100%);
        }

        .bg-dots {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 26px 26px;
            mask-image: linear-gradient(180deg, transparent 0%, black 30%, black 70%, transparent 100%);
        }

        .bg-beam {
            position: fixed;
            top: -30%;
            right: -10%;
            width: 45vw;
            height: 160vh;
            z-index: 0;
            background: linear-gradient(90deg, transparent, rgba(24,119,242,0.08), transparent);
            transform: rotate(18deg);
            animation: beamDrift 14s ease-in-out infinite alternate;
        }

        @keyframes beamDrift {
            from { transform: rotate(18deg) translateX(0); opacity: 0.6; }
            to   { transform: rotate(18deg) translateX(-8vw); opacity: 1; }
        }

        /* ─── Full-bleed post image ─── */
        .post-image-wrap {
            position: fixed;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            display: none;
        }

        .post-image-wrap.visible { display: block; }

        .post-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.06);
            animation: kenburns 30s ease-in-out infinite alternate;
        }

        @keyframes kenburns {
            from { transform: scale(1.06) translate(0, 0); }
            to   { transform: scale(1.14) translate(-1.5%, -1%); }
        }

        .post-image-wrap::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg,
                rgba(8,16,32,0.65) 0%,
                rgba(8,16,32,0.10) 30%,
                rgba(8,16,32,0.20) 50%,
                rgba(8,16,32,0.95) 100%);
        }

        /* ─── Header ─── */
        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 28px 44px;
            background: linear-gradient(180deg, rgba(8,16,32,0.92) 0%, rgba(8,16,32,0.55) 65%, transparent 100%);
            pointer-events: none;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .fb-badge {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: linear-gradient(145deg, var(--fb-blue-light), var(--fb-blue));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Archivo Black', sans-serif;
            font-size: 2.3rem;
            box-shadow: 0 8px 28px rgba(24,119,242,0.5);
            animation: badgePulse 4s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%, 100% { box-shadow: 0 8px 28px rgba(24,119,242,0.5); }
            50%      { box-shadow: 0 8px 42px rgba(24,119,242,0.8); }
        }

        .brand-text .kicker {
            font-family: 'Archivo', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--fb-blue-light);
        }

        .brand-text .title {
            font-family: 'Archivo Black', sans-serif;
            font-size: 1.6rem;
            letter-spacing: 0.01em;
            margin-top: 2px;
        }

        .live-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.6);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: liveBlink 1.6s ease-in-out infinite;
        }

        @keyframes liveBlink {
            0%, 100% { opacity: 1; box-shadow: 0 0 10px rgba(34,197,94,0.9); }
            50%      { opacity: 0.35; box-shadow: none; }
        }

        .clock-area { text-align: right; }

        .clock-time {
            font-family: 'Archivo Black', sans-serif;
            font-size: 2.6rem;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .clock-date {
            font-size: 0.9rem;
            font-weight: 600;
            color: rgba(255,255,255,0.55);
            margin-top: 6px;
            text-transform: capitalize;
        }

        /* ─── Single post content ─── */
        .post-content {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            z-index: 10;
            padding: 0 64px 72px;
            max-width: 1400px;
            max-height: 75vh;
            overflow-y: auto;
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1s ease, transform 1s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .post-content.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .post-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .post-date-chip {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(24,119,242,0.95);
            padding: 10px 22px;
            border-radius: 100px;
            font-family: 'Archivo', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            box-shadow: 0 4px 20px rgba(24,119,242,0.4);
        }

        .post-label {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.5);
        }

        .post-text {
            font-size: clamp(1.4rem, 2.8vw, 2.6rem);
            font-weight: 800;
            line-height: 1.35;
            text-shadow: 0 3px 24px rgba(0,0,0,0.7);
            max-height: 60vh;
            overflow-y: auto;
        }

        /* Text-only post: giant centered typography */
        .post-textonly {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 140px 10vw 120px;
            text-align: center;
            background: radial-gradient(ellipse 70% 55% at 50% 45%, rgba(24,119,242,0.16) 0%, transparent 70%);
            opacity: 0;
            transform: scale(0.97);
            transition: opacity 1s ease, transform 1s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .post-textonly.visible {
            display: flex;
            opacity: 1;
            transform: scale(1);
        }

        .big-quote {
            font-family: 'Archivo Black', sans-serif;
            font-size: 9rem;
            line-height: 0.5;
            color: var(--fb-blue);
            margin-bottom: 48px;
            opacity: 0.9;
            animation: quoteFloat 6s ease-in-out infinite alternate;
        }

        @keyframes quoteFloat {
            from { transform: translateY(0); }
            to   { transform: translateY(-12px); }
        }

        .post-textonly .post-text {
            font-size: clamp(1.6rem, 3.2vw, 3rem);
            max-height: 55vh;
            overflow-y: auto;
        }

        .post-textonly .post-meta {
            justify-content: center;
            margin-top: 44px;
            margin-bottom: 0;
        }

        /* ─── Footer ─── */
        .bottom-bar {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            z-index: 40;
            padding: 0 44px 24px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            background: linear-gradient(0deg, rgba(8,16,32,0.85) 0%, transparent 100%);
            pointer-events: none;
        }

        .page-handle {
            font-family: 'Archivo', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: rgba(255,255,255,0.55);
            letter-spacing: 0.06em;
        }

        /* ─── Loading / error states ─── */
        .state-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--ink);
            transition: opacity 0.6s;
        }

        .state-screen.hidden { opacity: 0; pointer-events: none; }

        .loader-ring {
            width: 72px;
            height: 72px;
            border: 5px solid rgba(24,119,242,0.2);
            border-top-color: var(--fb-blue);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .state-msg {
            margin-top: 30px;
            font-family: 'Archivo', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: rgba(255,255,255,0.75);
        }

        .state-sub {
            margin-top: 12px;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.4);
        }

        .retry-note {
            margin-top: 24px;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <div class="bg-dots"></div>
    <div class="bg-beam"></div>

    <!-- Full-bleed post image -->
    <div class="post-image-wrap" id="postImageWrap">
        <img class="post-image" id="postImage" src="" alt="">
    </div>

    <!-- Header -->
    <div class="top-bar">
        <div class="brand">
            <div class="fb-badge">f</div>
            <div class="brand-text">
                <div class="kicker">Molėtų progimnazija</div>
                <div class="title">Naujienos iš Facebook</div>
                <div class="live-chip"><span class="live-dot"></span> Naujausias įrašas</div>
            </div>
        </div>
        <div class="clock-area">
            <div class="clock-time" id="clockTime">--:--</div>
            <div class="clock-date" id="clockDate"></div>
        </div>
    </div>

    <!-- Single post: image layout -->
    <div class="post-content" id="postContent">
        <div class="post-meta">
            <span class="post-date-chip" id="postDate">📅 —</span>
            <span class="post-label">Naujausias įrašas</span>
        </div>
        <div class="post-text" id="postText"></div>
    </div>

    <!-- Single post: text-only layout -->
    <div class="post-textonly" id="postTextOnly">
        <div class="big-quote">“</div>
        <div class="post-text" id="postTextBig"></div>
        <div class="post-meta">
            <span class="post-date-chip" id="postDateTextOnly">📅 —</span>
        </div>
    </div>

    <!-- Footer -->
    <div class="bottom-bar">
        <div class="page-handle" id="pageHandle">facebook.com/Mokykla.Moletai</div>
    </div>

    <!-- Loading -->
    <div class="state-screen" id="loadingScreen">
        <div class="loader-ring"></div>
        <div class="state-msg">Kraunamas naujausias įrašas…</div>
        <div class="state-sub" id="loadingSub">Jungiamasi prie naujienų šaltinio</div>
        <div class="retry-note">Bandoma gauti įrašus iš Facebook</div>
    </div>

<script>
(function() {
    'use strict';

    // ─── Config from URL params ───
    const params = new URLSearchParams(window.location.search);
    const PAGE_ID = params.get('page') || 'Mokykla.Moletai';

    document.getElementById('pageHandle').textContent = 'facebook.com/' + PAGE_ID;

    const DAY_NAMES = ['Sekmadienis', 'Pirmadienis', 'Antradienis', 'Trečiadienis', 'Ketvirtadienis', 'Penktadienis', 'Šeštadienis'];
    const MONTH_NAMES = ['sausio', 'vasario', 'kovo', 'balandžio', 'gegužės', 'birželio', 'liepos', 'rugpjūčio', 'rugsėjo', 'spalio', 'lapkričio', 'gruodžio'];
    const MONTH_SHORT = ['Sau', 'Vas', 'Kov', 'Bal', 'Geg', 'Bir', 'Lie', 'Rgp', 'Rgs', 'Spa', 'Lap', 'Gru'];

    // ─── Clock ───
    function updateClock() {
        const now = new Date();
        document.getElementById('clockTime').textContent =
            String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        document.getElementById('clockDate').textContent =
            DAY_NAMES[now.getDay()] + ', ' + now.getFullYear() + ' m. ' + MONTH_NAMES[now.getMonth()] + ' ' + now.getDate() + ' d.';
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ─── RSS feed from rss.app ───
    const RSS_FEED_URL = 'https://rss.app/feeds/X0EQ2Ue9pn0SEwIs.xml';

    // CORS proxies to bypass browser restrictions on GitHub Pages
    const CORS_PROXIES = [
        url => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
        url => 'https://corsproxy.io/?url=' + encodeURIComponent(url),
        url => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url)
    ];

    async function fetchXmlWithTimeout(url, ms) {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), ms);
        try {
            const res = await fetch(url, { signal: ctrl.signal });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const text = await res.text();
            return new DOMParser().parseFromString(text, 'text/xml');
        } finally {
            clearTimeout(t);
        }
    }

    async function fetchLatestPost() {
        // Try direct fetch first
        try {
            document.getElementById('loadingSub').textContent = 'Bandoma tiesiogiai…';
            const doc = await fetchXmlWithTimeout(RSS_FEED_URL, 10000);
            const item = doc.querySelector('item');
            if (item) return item;
        } catch (e) {
            console.warn('Direct fetch failed:', e.message);
        }

        // Try through CORS proxies
        for (const proxy of CORS_PROXIES) {
            try {
                const proxyUrl = proxy(RSS_FEED_URL);
                const proxyHost = proxyUrl.split('://')[1]?.split('/')[0] || 'proxy';
                document.getElementById('loadingSub').textContent = 'Bandoma: ' + proxyHost;
                const doc = await fetchXmlWithTimeout(proxyUrl, 12000);
                
                // Check for parse errors
                const parseError = doc.querySelector('parsererror');
                if (parseError) throw new Error('XML parse error');
                
                const item = doc.querySelector('item');
                if (item) {
                    console.log('Success via proxy:', proxyHost);
                    return item;
                }
            } catch (e) {
                console.warn('Proxy failed:', e.message);
            }
        }
        return null;
    }

    // ─── Parse RSS item ───
    function parseItem(item) {
        // Get text from description or title
        let text = '';
        const descEl = item.querySelector('description');
        if (descEl && descEl.textContent) {
            // Strip HTML tags from description
            const tmp = document.createElement('div');
            tmp.innerHTML = descEl.textContent;
            text = tmp.textContent || '';
        }
        if (!text) {
            const titleEl = item.querySelector('title');
            text = titleEl ? titleEl.textContent : 'Naujausias įrašas';
        }
        text = text.replace(/\s+/g, ' ').trim();

        // Image: from enclosure, media:content, or first <img> in description
        let image = null;
        
        // Try enclosure element
        const enclosure = item.querySelector('enclosure');
        if (enclosure && enclosure.getAttribute('type')?.startsWith('image/')) {
            image = enclosure.getAttribute('url');
        }
        
        // Try media:content or media:thumbnail
        if (!image) {
            const mediaContent = item.getElementsByTagName('media:content')[0] || 
                               item.getElementsByTagName('media:thumbnail')[0];
            if (mediaContent) {
                image = mediaContent.getAttribute('url');
            }
        }
        
        // Try first <img> in description
        if (!image && descEl && descEl.textContent) {
            const tmp = document.createElement('div');
            tmp.innerHTML = descEl.textContent;
            const imgEl = tmp.querySelector('img');
            if (imgEl) image = imgEl.src;
        }

        // Date from pubDate
        const pubDateEl = item.querySelector('pubDate');
        const date = pubDateEl ? new Date(pubDateEl.textContent) : null;

        return { text, image, date };
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function formatDate(d) {
        if (!d || isNaN(d)) return 'Šiandien';
        return MONTH_SHORT[d.getMonth()] + ' ' + d.getDate() + ' d.';
    }

    // ─── Render single post full-screen ───
    function renderPost(post) {
        const dateStr = '📅 ' + formatDate(post.date);

        if (post.image) {
            // Image layout: full-bleed background + text overlay
            const img = document.getElementById('postImage');
            img.onerror = function() {
                // Fall back to text-only layout if image fails
                document.getElementById('postImageWrap').classList.remove('visible');
                document.getElementById('postContent').classList.remove('visible');
                renderTextOnly(post, dateStr);
            };
            img.src = post.image;
            document.getElementById('postImageWrap').classList.add('visible');

            document.getElementById('postDate').textContent = dateStr;
            document.getElementById('postText').innerHTML = escapeHtml(post.text);

            setTimeout(() => {
                document.getElementById('postContent').classList.add('visible');
                autoScrollText(document.getElementById('postText'));
            }, 300);
        } else {
            renderTextOnly(post, dateStr);
        }

        document.getElementById('loadingScreen').classList.add('hidden');
    }

    function renderTextOnly(post, dateStr) {
        document.getElementById('postDateTextOnly').textContent = dateStr;
        document.getElementById('postTextBig').innerHTML = escapeHtml(post.text);
        document.getElementById('postTextOnly').classList.add('visible');
        autoScrollText(document.getElementById('postTextBig'));
    }

    // Auto-scroll long text to show full content
    function autoScrollText(el) {
        if (!el) return;
        // Reset scroll
        el.scrollTop = 0;
        
        // Check if content overflows
        setTimeout(() => {
            if (el.scrollHeight > el.clientHeight) {
                let scrollPos = 0;
                const scrollSpeed = 1; // pixels per frame
                let scrollDirection = 1;
                let pauseFrames = 0;
                const PAUSE_AT_ENDS = 120; // frames to pause at top/bottom
                
                function scrollStep() {
                    if (pauseFrames > 0) {
                        pauseFrames--;
                        requestAnimationFrame(scrollStep);
                        return;
                    }
                    
                    scrollPos += scrollSpeed * scrollDirection;
                    
                    // Reverse at bottom
                    if (scrollPos >= el.scrollHeight - el.clientHeight) {
                        scrollPos = el.scrollHeight - el.clientHeight;
                        scrollDirection = -1;
                        pauseFrames = PAUSE_AT_ENDS;
                    }
                    // Reverse at top
                    if (scrollPos <= 0) {
                        scrollPos = 0;
                        scrollDirection = 1;
                        pauseFrames = PAUSE_AT_ENDS;
                    }
                    
                    el.scrollTop = scrollPos;
                    requestAnimationFrame(scrollStep);
                }
                
                // Start after initial pause
                pauseFrames = PAUSE_AT_ENDS;
                requestAnimationFrame(scrollStep);
            }
        }, 500);
    }

    // ─── Error state with auto-retry ───
    function showError() {
        document.getElementById('loadingSub').textContent = 'Nepavyko gauti įrašų';
        document.querySelector('.retry-note').textContent = 'Bandoma dar kartą po 60 sekundžių…';
        setTimeout(init, 60000);
    }

    // ─── Init ───
    async function init() {
        const item = await fetchLatestPost();

        if (!item) {
            showError();
            return;
        }

        renderPost(parseItem(item));
    }

    init();

    // Refresh every 5 minutes to pick up new posts
    setInterval(init, 5 * 60 * 1000);
})();
</script>
</body>
</html>
