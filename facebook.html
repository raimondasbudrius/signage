<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook naujienos – Molėtų progimnazija</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        body {
            font-family: 'Lexend', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 600;
            background-color: #e8f0fe;
            color: #1e293b;
        }

        /* ─── Header bar (matches tvarkarastis) ─── */
        .header-bar {
            background: linear-gradient(135deg, #1a73e8, #1557b0);
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            margin: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
            z-index: 50;
        }

        .header-left h2 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .header-left .subtitle {
            font-size: 0.85rem;
            opacity: 0.85;
            margin-top: 3px;
        }

        .header-right {
            text-align: right;
        }

        .clock-time {
            font-size: 1.6rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
        }

        .clock-date {
            font-size: 0.85rem;
            opacity: 0.85;
            margin-top: 2px;
            text-transform: capitalize;
        }

        /* ─── Slideshow area ─── */
        .slideshow {
            position: absolute;
            top: 90px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            overflow: hidden;
        }

        /* ─── Post card ─── */
        .post-card {
            position: absolute;
            inset: 0;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .post-card.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* ─── Post image ─── */
        .post-image-area {
            position: relative;
            flex: 1;
            min-height: 0;
            background: #0b1220;
            overflow: hidden;
        }

        .post-image-area.hidden { display: none; }

        /* Always show the FULL image: scale it down to fit the available
           area (object-fit: contain) instead of cropping it (cover). */
        .post-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .post-image.loaded { opacity: 1; }

        /* Image counter badge */
        .img-counter {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(26, 115, 232, 0.9);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: none;
        }

        .img-counter.visible { display: block; }

        /* ─── Post content area ─── */
        .post-body {
            padding: 24px 32px;
            max-height: 45%;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #1a73e8 transparent;
        }

        .post-body::-webkit-scrollbar { width: 6px; }
        .post-body::-webkit-scrollbar-track { background: transparent; }
        .post-body::-webkit-scrollbar-thumb { background: #1a73e8; border-radius: 3px; }

        .post-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .post-date-badge {
            display: inline-block;
            background: #1a73e8;
            color: white;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .post-number-badge {
            display: inline-block;
            background: #e8f0fe;
            color: #1a73e8;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid #1a73e8;
        }

        .post-title {
            font-family: 'Lexend', 'Segoe UI', sans-serif;
            font-weight: 700;
            font-size: clamp(1.8rem, 3.4vw, 3rem);
            line-height: 1.2;
            color: #1e293b;
            margin-bottom: 14px;
        }

        .post-text {
            font-size: clamp(1.5rem, 2.8vw, 2.4rem);
            line-height: 1.45;
            color: #475569;
        }

        /* Image-only post (no title/text): show full image, no cropping */
        .post-card.image-only .post-image {
            object-fit: contain;
            background: #0b1220;
        }

        .post-card.image-only .post-image-area { background: #0b1220; }

        .post-card.image-only .post-body {
            max-height: none;
            flex: 0 0 auto;
            padding: 14px 32px;
            display: flex;
            align-items: center;
        }

        .post-card.image-only .post-meta { margin-bottom: 0; }

        /* Text-only post: centered layout */
        .post-card.text-only .post-image-area { display: none; }

        .post-card.text-only .post-body {
            max-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 'safe' keeps overflowing content reachable from the top when the
               auto-scroll fallback kicks in (plain 'center' would clip it) */
            justify-content: safe center;
            text-align: center;
            padding: 48px 64px;
        }

        .post-card.text-only .post-meta {
            justify-content: center;
            order: 3;
            margin-top: 24px;
            margin-bottom: 0;
        }

        .post-card.text-only .post-title {
            font-size: clamp(2.2rem, 4.5vw, 4rem);
            max-width: 85%;
        }

        .post-card.text-only .post-text {
            font-size: clamp(1.8rem, 3.4vw, 3rem);
            max-width: 80%;
        }

        /* ─── Post progress dots ─── */
        .post-dots {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 45;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .post-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #cbd5e1;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .post-dot.active {
            width: 28px;
            border-radius: 5px;
            background: #1a73e8;
            box-shadow: 0 0 8px rgba(26, 115, 232, 0.5);
        }

        /* ─── Footer ─── */
        .footer-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 8px 28px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            pointer-events: none;
            z-index: 40;
        }

        .page-handle {
            font-size: 0.85rem;
            font-weight: 600;
            color: #64748b;
        }

        /* ─── Embed mode: hide header when embedded in index.html ─── */
        body.embed .header-bar { display: none; }
        body.embed .slideshow { top: 10px; }

        /* ─── Loading / error states ─── */
        .state-screen {
            position: absolute;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #e8f0fe;
            transition: opacity 0.6s;
        }

        .state-screen.hidden { opacity: 0; pointer-events: none; }

        .loader-ring {
            width: 56px;
            height: 56px;
            border: 5px solid #cbd5e1;
            border-top-color: #1a73e8;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .state-msg {
            margin-top: 24px;
            font-weight: 700;
            font-size: 1.1rem;
            color: #1e293b;
        }

        .state-sub {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #64748b;
        }

        .retry-note {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header-bar">
        <div class="header-left">
            <h2>Molėtų progimnazijos naujienos</h2>
            <div class="subtitle">Paskutiniai įrašai iš Facebook</div>
        </div>
        <div class="header-right">
            <div class="clock-time" id="clockTime">--:--</div>
            <div class="clock-date" id="clockDate"></div>
        </div>
    </div>

    <!-- Slideshow -->
    <div class="slideshow" id="slideshow">
        <!-- Post cards injected here -->
    </div>

    <!-- Post dots -->
    <div class="post-dots" id="postDots"></div>

    <!-- Footer -->
    <div class="footer-bar">
        <div class="page-handle" id="pageHandle">facebook.com/Mokykla.Moletai</div>
    </div>

    <!-- Loading -->
    <div class="state-screen" id="loadingScreen">
        <div class="loader-ring"></div>
        <div class="state-msg">Kraunami naujausi įrašai…</div>
        <div class="state-sub" id="loadingSub">Jungiamasi prie naujienų šaltinio</div>
        <div class="retry-note">Bandoma gauti įrašus iš Facebook</div>
    </div>

<script>
(function() {
    'use strict';

    // ─── Config from URL params ───
    const params = new URLSearchParams(window.location.search);
    const PAGE_ID = params.get('page') || 'Mokykla.Moletai';
    const POST_LIMIT = Math.min(parseInt(params.get('limit')) || 5, 10);
    const POST_DELAY = (parseInt(params.get('delay')) || 15) * 1000;
    const IMAGE_DELAY = 5000;
    const EMBED_MODE = params.get('embed') === '1';

    if (EMBED_MODE) {
        document.body.classList.add('embed');
    }

    document.getElementById('pageHandle').textContent = 'facebook.com/' + PAGE_ID;

    const DAY_NAMES = ['Sekmadienis', 'Pirmadienis', 'Antradienis', 'Trečiadienis', 'Ketvirtadienis', 'Penktadienis', 'Šeštadienis'];
    const MONTH_NAMES = ['sausio', 'vasario', 'kovo', 'balandžio', 'gegužės', 'birželio', 'liepos', 'rugpjūčio', 'rugsėjo', 'spalio', 'lapkričio', 'gruodžio'];
    const MONTH_SHORT = ['Sau', 'Vas', 'Kov', 'Bal', 'Geg', 'Bir', 'Lie', 'Rgp', 'Rgs', 'Spa', 'Lap', 'Gru'];

    // ─── Clock ───
    function updateClock() {
        const now = new Date();
        document.getElementById('clockTime').textContent =
            String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        document.getElementById('clockDate').textContent =
            DAY_NAMES[now.getDay()] + ', ' + now.getFullYear() + ' m. ' + MONTH_NAMES[now.getMonth()] + ' ' + now.getDate() + ' d.';
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ─── RSS feed from fetchrss.com ───
    const RSS_FEED_URL = 'https://fetchrss.com/feed/1wyQIa8hjC5i1wyQIj2yO3pk.rss';

    // Feed šaltinių grandinė: kiekviena strategija grąžina įrašų masyvą
    // ({ title, text, images, date }). Vieši CORS proxy dažnai genda arba
    // pradeda reikalauti API raktų, todėl turime kelis skirtingus šaltinius
    // + vietinį feed-cache.xml (tas pats GitHub Pages, be CORS) + localStorage.
    async function fetchText(url, ms) {
        const res = await fetchWithTimeout(url, ms);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.text();
    }

    function xmlToPosts(xmlText) {
        const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
        if (doc.querySelector('parsererror')) throw new Error('XML parse error');
        const items = Array.from(doc.querySelectorAll('item'));
        if (!items.length) throw new Error('no items');
        return items.map(parseItem).filter(p => p.title || p.text || p.images.length > 0);
    }

    // rss2json.com grąžina feed kaip JSON (CORS: Access-Control-Allow-Origin: *)
    function rss2jsonToPosts(data) {
        if (!data || data.status !== 'ok' || !Array.isArray(data.items) || !data.items.length) {
            throw new Error('bad rss2json response');
        }
        return data.items.map(it => {
            const holder = document.createElement('div');
            holder.innerHTML = it.description || it.content || '';
            holder.querySelectorAll('span').forEach(span => {
                if (/feed generated/i.test(span.textContent)) span.remove();
            });
            const tmp = holder.cloneNode(true);
            tmp.querySelectorAll('br').forEach(br => br.replaceWith('\n'));
            let text = (tmp.textContent || '').replace(/[ \t]+/g, ' ').replace(/\n\s*\n/g, '\n').trim();

            let title = (it.title || '').trim().replace(/\.\.\.$/, '').replace(/\s+Posted$/, '').trim();
            if (!text.trim() || text.trim() === title) text = '';

            const images = [];
            const seen = new Set();
            const addImage = url => {
                if (!url) return;
                const ampEntity = String.fromCharCode(38) + 'amp;';
                const decoded = url.split(ampEntity).join(String.fromCharCode(38));
                const key = decoded.split('?')[0];
                if (!seen.has(key)) { seen.add(key); images.push(decoded); }
            };
            if (it.enclosure && it.enclosure.link) addImage(it.enclosure.link);
            holder.querySelectorAll('img').forEach(img => addImage(img.getAttribute('src')));
            if (it.thumbnail) addImage(it.thumbnail);

            let date = null;
            if (it.pubDate) {
                date = new Date(it.pubDate + ' UTC');
                if (isNaN(date.getTime())) date = new Date(it.pubDate);
                if (isNaN(date.getTime())) date = null;
            }
            return { title, text, images, date };
        }).filter(p => p.title || p.text || p.images.length > 0);
    }

    const FEED_STRATEGIES = [
        { name: 'tiesiogiai', run: () => fetchText(RSS_FEED_URL, 10000).then(xmlToPosts) },
        {
            name: 'allorigins (get)',
            run: async () => {
                const res = await fetchWithTimeout(
                    'https://api.allorigins.win/get?url=' + encodeURIComponent(RSS_FEED_URL), 15000);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                if (!data || typeof data.contents !== 'string' || !data.contents.trim()) {
                    throw new Error('empty contents');
                }
                return xmlToPosts(data.contents);
            }
        },
        {
            name: 'rss2json',
            run: async () => {
                const res = await fetchWithTimeout(
                    'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(RSS_FEED_URL), 15000);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return rss2jsonToPosts(await res.json());
            }
        },
        {
            name: 'allorigins (raw)',
            run: () => fetchText(
                'https://api.allorigins.win/raw?url=' + encodeURIComponent(RSS_FEED_URL), 12000).then(xmlToPosts)
        },
        {
            name: 'codetabs',
            run: () => fetchText(
                'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(RSS_FEED_URL), 12000).then(xmlToPosts)
        },
        {
            // Statiška feed kopija šiame pačiame repo (GitHub Pages) – CORS neegzistuoja
            name: 'vietinis feed-cache.xml',
            run: () => fetchText('feed-cache.xml?ts=' + Date.now(), 8000).then(xmlToPosts)
        }
    ];

    // Paskutinis sėkmingai gautas feed, kad ekranas niekada neliktų tuščias
    const FEED_CACHE_KEY = 'signage-fb-feed-cache';

    // ─── Translation (English → Lithuanian) ───
    // Order of operations:
    //   1) Static dictionary for recurring Facebook/fetchrss boilerplate
    //      titles – deterministic, grammar-checked, needs no network.
    //   2) Text already in Lithuanian is kept as-is (this feed is mostly
    //      Lithuanian and sending it through MT would only risk corruption).
    //   3) Machine translation: Google Translate (gtx) endpoint first,
    //      MyMemory free API as fallback.
    // Results are cached so repeated refreshes don't re-translate the same text.
    const translationCache = new Map();

    // ─── Known phrases (exact Lithuanian translations, no network needed) ───
    const STATIC_PHRASES = [
        { re: /^this content isn'?t available right now\.?$/i, lt: 'Šis turinys šiuo metu nepasiekiamas' },
        { re: /^this content isn'?t available\.?$/i, lt: 'Šis turinys nepasiekiamas' },
        { re: /^photo by (.+)$/i, lt: 'Nuotrauka – $1' },
        { re: /^photos by (.+)$/i, lt: 'Nuotraukos – $1' },
        { re: /^video by (.+)$/i, lt: 'Vaizdo įrašas – $1' }
    ];

    // Lithuanian genitive (kilmininkas) of a page name – needed to turn
    // fetchrss placeholders like "Post from Molėtų progimnazija" into
    // "Molėtų progimnazijos įrašas"
    function toGenitive(name) {
        const n = name.trim();
        if (!n) return null;
        const last = n.slice(-1);
        const lower = last.toLowerCase();
        const isUpper = last !== lower;
        const suf = s => (isUpper ? s.toUpperCase() : s);

        // Masculine nouns ending in -as / -is / -ys / -us
        if (lower === 's') {
            const prev = n.slice(-2, -1).toLowerCase();
            if (prev === 'a') return n.slice(0, -2) + suf('o');
            if (prev === 'i') return n.slice(0, -2) + suf('io');
            if (prev === 'y') return n.slice(0, -2) + suf('io');
            if (prev === 'u') return n.slice(0, -2) + suf('aus');
            return n + suf('o');
        }
        if ('aą'.includes(lower)) return n.slice(0, -1) + suf('os');
        if ('eęė'.includes(lower)) return n.slice(0, -1) + suf('ės');
        if ('iį'.includes(lower)) return n.slice(0, -1) + suf('ės');
        if (lower === 'y') return n.slice(0, -1) + suf('io');
        if ('uų'.includes(lower)) return n.slice(0, -1) + suf('aus');
        if (lower === 'o') return n;
        return null;
    }

    function staticTranslation(text) {
        const t = text.trim();

        // "A post from <Page>" / "Post from <Page>" – fetchrss placeholder title
        const postFrom = t.match(/^(?:a\s+)?post from\s+(.+)$/i);
        if (postFrom) {
            const gen = toGenitive(postFrom[1]);
            return gen ? gen + ' įrašas' : 'Įrašas';
        }

        for (const entry of STATIC_PHRASES) {
            if (entry.re.test(t)) return t.replace(entry.re, entry.lt);
        }
        return null;
    }

    // Heuristic: does this text look Lithuanian? Lithuanian diacritics
    // (ą č ę ė į š ų ū ž) almost never appear in other languages
    const LT_WORDS = new Set([
        'ir', 'bet', 'kad', 'iš', 'su', 'bei', 'ar', 'į', 'nuo', 'po', 'per',
        'iki', 'bus', 'kaip', 'tai', 'tik', 'dar', 'jau', 'labai', 'dėl',
        'apie', 'kuris', 'kuri', 'mes', 'jūs', 'jų', 'mūsų', 'kl', 'mok', 'val'
    ]);

    function isLithuanian(text) {
        const sample = text.slice(0, 600);
        const diacritics = (sample.match(/[ąčęėįšųūžĄČĘĖĮŠŲŪŽ]/g) || []).length;
        if (diacritics >= 2) return true;
        const words = sample.toLowerCase().split(/[^a-ząčęėįšųūž]+/).filter(Boolean);
        if (!words.length) return false;
        const ltWords = words.filter(w => LT_WORDS.has(w)).length;
        return ltWords / words.length >= 0.1;
    }

    // Short codes and schedule lines (e.g. "8a kl. mok. 8 - 10 val.") should
    // not go through MT – only translate text that looks like real sentences
    function looksTranslatable(text) {
        const words = text.split(/\s+/).filter(Boolean);
        const longWords = words.filter(w => w.replace(/[^a-ząčęėįšųūž]/gi, '').length >= 4).length;
        return longWords >= 2;
    }

    function fetchWithTimeout(url, ms, options) {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), ms);
        return fetch(url, Object.assign({ signal: ctrl.signal }, options || {}))
            .finally(() => clearTimeout(t));
    }

    async function translateViaGoogle(text) {
        const res = await fetchWithTimeout(
            'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=lt&dt=t',
            8000,
            {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                body: 'q=' + encodeURIComponent(text)
            }
        );
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const out = (Array.isArray(data) && Array.isArray(data[0]) ? data[0] : [])
            .map(seg => (seg && typeof seg[0] === 'string') ? seg[0] : '')
            .join('');
        if (!out || /<\s*(html|body|head)/i.test(out)) throw new Error('bad response');
        return out;
    }

    async function translateViaMyMemory(text) {
        const url = 'https://api.mymemory.translated.net/get?q=' +
            encodeURIComponent(text.slice(0, 500)) + '&langpair=en|lt';
        const res = await fetchWithTimeout(url, 8000);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const translated = data && data.responseData ? data.responseData.translatedText : '';
        if (!translated || data.responseStatus !== 200) throw new Error('bad response');
        return translated;
    }

    async function translateText(text) {
        if (!text || text.trim().length === 0) return text;
        if (translationCache.has(text)) return translationCache.get(text);

        // 1) Known boilerplate phrases – translated locally, no network needed
        const known = staticTranslation(text);
        if (known) {
            translationCache.set(text, known);
            return known;
        }

        // 2) Text already in Lithuanian (or schedule-like codes) – leave as-is
        if (isLithuanian(text) || !looksTranslatable(text)) {
            translationCache.set(text, text);
            return text;
        }

        // 3) Machine translation: Google first, MyMemory as fallback
        try {
            const translated = await translateViaGoogle(text);
            translationCache.set(text, translated);
            return translated;
        } catch (e) {
            console.warn('Google translation failed:', e.message);
        }

        try {
            const translated = await translateViaMyMemory(text);
            translationCache.set(text, translated);
            return translated;
        } catch (e) {
            console.warn('MyMemory translation failed:', e.message);
        }

        return text;
    }

    async function fetchFeed() {
        for (const strategy of FEED_STRATEGIES) {
            try {
                document.getElementById('loadingSub').textContent = 'Bandoma: ' + strategy.name + '…';
                const newPosts = await strategy.run();
                if (newPosts && newPosts.length) {
                    console.log('Feed gautas per:', strategy.name);
                    return newPosts;
                }
            } catch (e) {
                console.warn('Feed strategy failed (' + strategy.name + '):', e.message);
            }
        }

        // Visi šaltiniai nepasiekiami – rodom paskutinį išsaugotą feed
        const cached = readLocalFeedCache();
        if (cached) {
            console.warn('Naudojamas paskutinis išsaugotas feed (visi šaltiniai nepasiekiami)');
            return cached;
        }

        return null;
    }

    // Read the last successfully fetched feed from localStorage (dates are
    // revived as Date objects so the rest of the code can use them directly)
    function readLocalFeedCache() {
        try {
            const cached = JSON.parse(localStorage.getItem(FEED_CACHE_KEY) || 'null');
            if (!Array.isArray(cached) || !cached.length) return null;
            cached.forEach(p => {
                p.images = Array.isArray(p.images) ? p.images : [];
                p.date = p.date ? new Date(p.date) : null;
                if (p.date && isNaN(p.date.getTime())) p.date = null;
            });
            return cached;
        } catch (e) { return null; }
    }

    // Warm the browser image cache in the background so post images appear
    // instantly when the signage player switches to this source
    function warmImageCache(postList) {
        (postList || []).forEach(p => {
            (p.images || []).forEach(url => {
                const img = new Image();
                img.src = url;
            });
        });
    }

    // ─── Parse RSS items ───
    function parseItem(item) {
        const titleEl = item.querySelector('title');
        let title = titleEl ? titleEl.textContent.trim() : '';
        title = title.replace(/\.\.\.$/, '').replace(/\s+Posted$/, '').trim();

        const descEl = item.querySelector('description');
        const descHtml = descEl ? descEl.textContent : '';

        // Parse description once and strip the "Feed generated with FetchRSS" watermark
        let descNode = null;
        if (descHtml) {
            descNode = document.createElement('div');
            descNode.innerHTML = descHtml;
            descNode.querySelectorAll('span').forEach(span => {
                if (/feed generated/i.test(span.textContent)) span.remove();
            });
        }

        let text = '';
        if (descNode) {
            const tmp = descNode.cloneNode(true);
            tmp.querySelectorAll('br').forEach(br => br.replaceWith('\n'));
            text = tmp.textContent || '';
        }
        if (!text.trim() || text.trim() === title) {
            text = '';
        }
        text = text.replace(/[ \t]+/g, ' ').replace(/\n\s*\n/g, '\n').trim();

        const images = [];
        const seen = new Set();

        function addImage(url) {
            if (!url) return;
            // Decode HTML entity for ampersand (built via char codes to stay robust)
            const ampEntity = String.fromCharCode(38) + 'amp;';
            const decoded = url.split(ampEntity).join(String.fromCharCode(38));
            const key = decoded.split('?')[0];
            if (!seen.has(key)) {
                seen.add(key);
                images.push(decoded);
            }
        }

        if (descNode) {
            descNode.querySelectorAll('img').forEach(img => addImage(img.getAttribute('src')));
        }

        Array.from(item.getElementsByTagName('media:content')).forEach(mc => {
            if (mc.getAttribute('medium') === 'image' || !mc.getAttribute('medium')) {
                addImage(mc.getAttribute('url'));
            }
        });

        const enclosure = item.querySelector('enclosure');
        if (enclosure && (enclosure.getAttribute('type') || '').startsWith('image/')) {
            addImage(enclosure.getAttribute('url'));
        }

        const pubDateEl = item.querySelector('pubDate');
        const date = pubDateEl ? new Date(pubDateEl.textContent) : null;

        return { title, text, images, date };
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function formatDate(d) {
        if (!d || isNaN(d)) return 'Šiandien';
        return MONTH_SHORT[d.getMonth()] + ' ' + d.getDate() + ' d.';
    }

    // ─── Translate post content ───
    async function translatePost(post) {
        const title = await translateText(post.title);

        // Translate line by line so Lithuanian content stays untouched and
        // only foreign (usually English boilerplate) lines get translated
        let text = post.text;
        if (text && text.trim()) {
            const lines = text.split('\n');
            text = (await Promise.all(
                lines.map(line => (line.trim() ? translateText(line) : line))
            )).join('\n');
        }

        return { ...post, title, text };
    }

    // ─── Slideshow state ───
    let posts = [];
    let currentPost = -1;
    let currentImage = 0;
    let postTimer = null;
    let imageTimer = null;
    let scrollAnim = null;
    let postCards = [];

    // ─── Fit long post content into the visible window ───
    // Posts with long text (e.g. multi-paragraph announcements) would overflow
    // the card and get clipped. We shrink the font size step by step until the
    // whole content fits into the window. If it still does not fit at the
    // minimum size, gentle auto-scrolling remains as a fallback (autoScrollText).
    const MIN_TEXT_FONT_PX = 15;   // floor for post body text
    const MIN_TITLE_FONT_PX = 20;  // floor for post title

    function fitCardContent(card) {
        const body = card.querySelector('.post-body');
        const textEl = card.querySelector('.post-text');
        const titleEl = card.querySelector('.post-title');
        if (!body || !textEl || !textEl.textContent.trim()) return;

        // Reset to CSS defaults so repeated fits (e.g. after resize) start fresh
        textEl.style.fontSize = '';
        if (titleEl) titleEl.style.fontSize = '';

        const fits = () => body.scrollHeight <= body.clientHeight + 2;
        if (fits()) return;

        // Shrink the body text first – the title should stay prominent
        let size = parseFloat(getComputedStyle(textEl).fontSize);
        while (!fits() && size > MIN_TEXT_FONT_PX) {
            size = Math.max(size * 0.92, MIN_TEXT_FONT_PX);
            textEl.style.fontSize = size.toFixed(2) + 'px';
        }

        // Still overflowing? Shrink the title too
        if (titleEl && titleEl.textContent.trim()) {
            let titleSize = parseFloat(getComputedStyle(titleEl).fontSize);
            while (!fits() && titleSize > MIN_TITLE_FONT_PX) {
                titleSize = Math.max(titleSize * 0.92, MIN_TITLE_FONT_PX);
                titleEl.style.fontSize = titleSize.toFixed(2) + 'px';
            }
        }
    }

    function refitAllCards() {
        postCards.forEach(fitCardContent);
    }

    // Re-fit text when the window size changes (rotation / different screen)
    let refitTimer = null;
    window.addEventListener('resize', () => {
        clearTimeout(refitTimer);
        refitTimer = setTimeout(refitAllCards, 200);
    });

    // The web font (Lexend) changes text metrics once loaded – re-fit then
    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => refitAllCards());
    }

    function buildPostCards() {
        const container = document.getElementById('slideshow');
        container.innerHTML = '';
        postCards = [];

        posts.forEach((post, index) => {
            const card = document.createElement('div');
            const isImageOnly = post.images.length > 0 && !post.title && !post.text;
            card.className = 'post-card'
                + (post.images.length === 0 ? ' text-only' : '')
                + (isImageOnly ? ' image-only' : '');

            const dateStr = formatDate(post.date);
            const numStr = 'Įrašas ' + (index + 1) + ' / ' + posts.length;

            card.innerHTML = `
                <div class="post-image-area">
                    <img class="post-image" src="" alt="">
                    <div class="img-counter"></div>
                </div>
                <div class="post-body">
                    <div class="post-meta">
                        <span class="post-date-badge">${escapeHtml(dateStr)}</span>
                        <span class="post-number-badge">${escapeHtml(numStr)}</span>
                    </div>
                    <div class="post-title">${escapeHtml(post.title)}</div>
                    <div class="post-text">${post.text ? escapeHtml(post.text).replace(/\n/g, '<br>') : ''}</div>
                </div>
            `;

            container.appendChild(card);
            postCards.push(card);
        });

        // Shrink the font of long posts so their full text fits into the window
        refitAllCards();
    }

    function buildDots() {
        const container = document.getElementById('postDots');
        container.innerHTML = '';
        posts.forEach((_, i) => {
            const dot = document.createElement('div');
            dot.className = 'post-dot';
            container.appendChild(dot);
        });
    }

    function updateDots() {
        document.querySelectorAll('.post-dot').forEach((dot, i) => {
            dot.classList.toggle('active', i === currentPost);
        });
    }

    function autoScrollText(el) {
        if (scrollAnim) cancelAnimationFrame(scrollAnim);
        if (!el) return;
        el.scrollTop = 0;

        setTimeout(() => {
            if (el.scrollHeight > el.clientHeight + 10) {
                let pos = 0;
                let dir = 1;
                let pause = 100;

                function step() {
                    if (pause > 0) { pause--; scrollAnim = requestAnimationFrame(step); return; }
                    pos += dir;
                    const max = el.scrollHeight - el.clientHeight;
                    if (pos >= max) { pos = max; dir = -1; pause = 140; }
                    if (pos <= 0) { pos = 0; dir = 1; pause = 140; }
                    el.scrollTop = pos;
                    scrollAnim = requestAnimationFrame(step);
                }
                scrollAnim = requestAnimationFrame(step);
            }
        }, 600);
    }

    function showImage(post, card, index) {
        currentImage = index;
        const img = card.querySelector('.post-image');
        const counter = card.querySelector('.img-counter');
        const imageArea = card.querySelector('.post-image-area');

        img.classList.remove('loaded');
        img.onload = () => img.classList.add('loaded');
        img.onerror = () => {
            if (post.images.length > 1) {
                post.images.splice(index, 1);
                if (currentImage >= post.images.length) currentImage = 0;
                showImage(post, card, currentImage);
            } else {
                imageArea.classList.add('hidden');
                counter.classList.remove('visible');
            }
        };
        img.src = post.images[index];

        if (post.images.length > 1) {
            counter.textContent = (index + 1) + ' / ' + post.images.length;
            counter.classList.add('visible');
        } else {
            counter.classList.remove('visible');
        }
    }

    function renderPost(index) {
        const post = posts[index];
        const card = postCards[index];

        // Hide all cards
        postCards.forEach(c => c.classList.remove('active'));

        // Show current card
        card.classList.add('active');

        if (post.images.length > 0) {
            showImage(post, card, 0);

            clearInterval(imageTimer);
            if (post.images.length > 1) {
                imageTimer = setInterval(() => {
                    showImage(post, card, (currentImage + 1) % post.images.length);
                }, IMAGE_DELAY);
            }
        }

        // Fallback for posts that still overflow even at the minimum font
        // size: gently auto-scroll the card body (.post-body is the element
        // that has overflow-y: auto) so all content remains visible
        autoScrollText(card.querySelector('.post-body'));

        updateDots();
        document.getElementById('loadingScreen').classList.add('hidden');
    }

    function advancePost() {
        currentPost = (currentPost + 1) % posts.length;
        renderPost(currentPost);
    }

    function startSlideshow() {
        buildPostCards();
        buildDots();
        advancePost();
        clearTimeout(postTimer);
        postTimer = setInterval(advancePost, POST_DELAY);
    }

    // ─── Seamless refresh helpers ───
    function postSignature(p) {
        return [p.title, p.text, p.images.join('|'), p.date ? p.date.getTime() : ''].join('\u0001');
    }

    function preloadImage(url) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(url);
            img.onerror = () => reject(new Error('image load failed'));
            img.src = url;
        });
    }

    async function swapSlideshow() {
        const keepIndex = Math.min(currentPost, posts.length - 1);

        // Preload the image that will be visible right after the swap to avoid flashing
        if (posts[keepIndex].images.length > 0) {
            try { await preloadImage(posts[keepIndex].images[0]); } catch (e) { /* ignore */ }
        }

        clearInterval(postTimer);
        clearInterval(imageTimer);
        currentImage = 0;

        buildPostCards();
        buildDots();
        currentPost = keepIndex;
        renderPost(keepIndex);

        clearTimeout(postTimer);
        postTimer = setInterval(advancePost, POST_DELAY);
    }

    function showError() {
        document.getElementById('loadingSub').textContent = 'Nepavyko gauti įrašų';
        document.querySelector('.retry-note').textContent = 'Bandoma dar kartą po 60 sekundžių…';
        setTimeout(init, 60000);
    }

    async function init() {
        // First load: if a previous feed is saved, show it instantly (viewers
        // never see the loading screen) while the fresh feed is fetched in the
        // background – the new content swaps in seamlessly when ready.
        if (posts.length === 0 && currentPost === -1) {
            const cached = readLocalFeedCache();
            if (cached) {
                posts = cached.slice(0, POST_LIMIT);
                warmImageCache(posts);
                console.log('Rodomas išsaugotas feed, kol naujas kraunamas fone');
                startSlideshow();
            }
        }

        let newPosts = await fetchFeed();

        if (!newPosts) {
            showError();
            return;
        }

        newPosts = newPosts.slice(0, POST_LIMIT);

        // Translate all posts from English to Lithuanian
        document.getElementById('loadingSub').textContent = 'Verčiama į lietuvių kalbą…';
        newPosts = await Promise.all(newPosts.map(translatePost));

        if (newPosts.length === 0) {
            showError();
            return;
        }

        // Save the translated feed so future (re)loads can show it instantly,
        // and pre-cache the post images in the background as well
        try { localStorage.setItem(FEED_CACHE_KEY, JSON.stringify(newPosts)); } catch (e) { /* ignore */ }
        warmImageCache(newPosts);

        // First load – start slideshow
        if (currentPost === -1 || posts.length === 0) {
            posts = newPosts;
            clearInterval(postTimer);
            clearInterval(imageTimer);
            currentPost = -1;
            startSlideshow();
            return;
        }

        // Refresh: compare content signatures; if nothing changed, keep showing
        // the current posts without any rebuild or visual refresh
        const changed = newPosts.length !== posts.length ||
            newPosts.some((p, i) => postSignature(p) !== postSignature(posts[i]));

        if (!changed) return;

        // Content changed – swap seamlessly (old posts stay visible until swap is ready)
        posts = newPosts;
        await swapSlideshow();
    }

    // ─── Signage integration ───
    // The signage player (index.html) keeps this page loaded in the background
    // and, when it is Facebook's turn, asks us to restart the slideshow from
    // post #1 instead of reloading the iframe. The posts are already fetched,
    // translated and image-cached at that point, so the switch is instant and
    // viewers never see the loading screen.
    window.addEventListener('message', (e) => {
        const msg = e && e.data;
        if (!msg || msg.type !== 'signage-restart') return;
        if (!posts.length) return; // not ready yet – the first render starts at #1 anyway

        clearInterval(postTimer);
        clearInterval(imageTimer);
        currentImage = 0;
        currentPost = 0;
        renderPost(0);
        clearTimeout(postTimer);
        postTimer = setInterval(advancePost, POST_DELAY);
        console.log('Signage: slideshow restarted from post #1');
    });

    init();

    setInterval(init, 5 * 60 * 1000);
})();
</script>
</body>
</html>
