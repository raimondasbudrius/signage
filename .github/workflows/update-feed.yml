name: Atnaujinti feed-cache.xml

on:
  schedule:
    - cron: '0 * * * *'  # kas valandą
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Atsisiųsti Facebook RSS feed
        run: |
          curl -sf --max-time 60 'https://fetchrss.com/feed/1wyQIa8hjC5i1wyQIj2yO3pk.rss' -o /tmp/feed.xml
          grep -q '<item>' /tmp/feed.xml || { echo 'Gautas feed tuščias arba sugadintas'; exit 1; }

      - name: Commit, jei pasikeitė
        run: |
          if ! cmp -s /tmp/feed.xml feed-cache.xml; then
            cp /tmp/feed.xml feed-cache.xml
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add feed-cache.xml
            git commit -m 'Atnaujintas feed-cache.xml [skip ci]'
            git push
            echo 'feed-cache.xml atnaujintas'
          else
            echo 'Feed nepasikeitė'
          fi
